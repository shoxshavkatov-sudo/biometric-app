<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Система Учета Рабочего Времени</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-card: #ffffff;
            --glass-border: #e2e8f0;
            --glass-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-primary: #1e293b;
            --accent-action: #2563eb;
            --accent-green: #16a34a;
            --accent-danger: #dc2626;
            --warning-color: #d97706;
            --input-bg: #f8fafc;
            --icon-stroke: #64748b;
            --icon-active: #2563eb;
        }

        [data-theme="dark"] {
            --bg-gradient: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.92);
            --glass-card: #1e293b;
            --glass-border: #334155;
            --glass-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --input-bg: #0f172a;
            --icon-stroke: #94a3b8;
            --icon-active: #60a5fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; transition: background 0.2s, color 0.2s, border-color 0.2s; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 110px;
            -webkit-tap-highlight-color: transparent;
        }

        /* Корпоративная Шапка */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: var(--glass-shadow);
        }
        .header-title {
            font-size: 15px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-main);
            display: flex; align-items: center; gap: 8px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px; font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }

        .container { padding: 20px 16px; max-width: 480px; margin: 0 auto; }

        /* Формы и текстовые поля */
        .glass-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px; font-weight: 500;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--input-bg);
            color: var(--text-main);
            margin-bottom: 14px;
            outline: none;
        }
        .glass-input:focus { border-color: var(--accent-action); }

        /* Экран Камеры */
        .camera-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 6px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 16px;
            overflow: hidden;
        }
        video { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; background: #000; }

        /* Строгие профессиональные кнопки */
        .btn-glass {
            width: 100%;
            padding: 15px;
            font-size: 15px; font-weight: 600;
            color: white; border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-glass:active { transform: scale(0.98); opacity: 0.9; }
        .btn-primary { background: var(--accent-primary); }
        .btn-action { background: var(--accent-action); }
        .btn-green { background: var(--accent-green); }
        .btn-danger { background: var(--accent-danger); }
        .btn-outline { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); }

        /* Карточки */
        .glass-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--glass-shadow);
        }
        .glass-card.late { border-left: 4px solid var(--warning-color); }

        /* Селектор количества дней месяца */
        .month-config {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
        }
        .month-config span { font-size: 13px; font-weight: 600; color: var(--text-sub); }
        .days-selector { display: flex; gap: 6px; }
        .day-btn {
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600; font-size: 13px;
            cursor: pointer;
        }
        .day-btn.active {
            background: var(--accent-action);
            color: white;
            border-color: var(--accent-action);
        }

        /* SVG Иконки */
        .svg-icon {
            width: 18px; height: 18px;
            stroke: var(--icon-stroke);
            stroke-width: 2; fill: none;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .nav-item.active .svg-icon { stroke: var(--icon-active); }

        /* Нижняя Навигационная Панель */
        .glass-nav {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 24px); max-width: 460px; height: 64px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: grid; grid-template-columns: repeat(4, 1fr);
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            z-index: 1000;
            padding: 0 4px;
        }
        .nav-item {
            background: none; border: none; color: var(--text-sub);
            font-size: 11px; font-weight: 600; display: flex; flex-direction: column;
            align-items: center; gap: 4px; cursor: pointer; padding: 8px 0;
            border-radius: 10px; transition: all 0.2s;
        }
        .nav-item.active { color: var(--icon-active); background: rgba(37, 99, 235, 0.08); }

        /* Пошаговая регистрация */
        .step-box { display: none; }
        .step-box.active { display: block; }
        .step-badge {
            display: inline-block; padding: 3px 8px; font-size: 11px; font-weight: 700;
            border-radius: 4px; background: rgba(37, 99, 235, 0.1); color: var(--accent-action); margin-bottom: 12px;
            letter-spacing: 0.05em; text-transform: uppercase;
        }

        /* Модальные окна */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            justify-content: center; align-items: center; padding: 20px; z-index: 2000;
        }
        .modal-content {
            background: var(--glass-card); border-radius: 16px; padding: 24px;
            width: 100%; max-width: 400px; border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow); text-align: center;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="header-title">
            <svg class="svg-icon" viewBox="0 0 24 24" style="stroke: var(--text-main);"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            Учет рабочего времени
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">
            <svg class="svg-icon" viewBox="0 0 24 24" style="width:14px; height:14px; stroke:var(--text-main);"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            Тема
        </button>
    </div>

    <div class="container">

        <!-- 1. ТЕРМИНАЛ (ФИКСАЦИЯ ВРЕМЕНИ) -->
        <div id="tab-scan" class="tab-pane">
            <select id="workerSelect" class="glass-input">
                <option value="">-- Выберите сотрудника --</option>
            </select>

            <div class="camera-card">
                <video id="webcam" autoplay playsinline></video>
            </div>

            <button class="btn-glass btn-action" onclick="processScan()">
                <svg class="svg-icon" viewBox="0 0 24 24" style="stroke:#fff;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Зафиксировать отметку
            </button>
        </div>

        <!-- 2. ЕЖЕМЕСЯЧНЫЙ ОТЧЕТ -->
        <div id="tab-summary" class="tab-pane" style="display: none;">
            <div class="month-config">
                <span>Рабочих дней в месяце:</span>
                <div class="days-selector">
                    <button class="day-btn" onclick="setWorkingDays(21, this)">21 дн.</button>
                    <button class="day-btn active" onclick="setWorkingDays(22, this)">22 дн.</button>
                </div>
            </div>

            <div id="summaryList"></div>
        </div>

        <!-- 3. ДОБАВЛЕНИЕ СОТРУДНИКА -->
        <div id="tab-add" class="tab-pane" style="display: none;">
            <div class="glass-card">

                <!-- ШАГ 1: Ввод ФИО и Оклада -->
                <div id="add-step-1" class="step-box active">
                    <span class="step-badge">Шаг 1 из 2</span>
                    <h3 style="margin-bottom:14px; font-size:16px; font-weight:700;">Данные нового сотрудника</h3>

                    <label style="font-size:12px; color:var(--text-sub); display:block; margin-bottom:4px; font-weight:600;">ФИО сотрудника</label>
                    <input type="text" id="newEmpName" placeholder="Иванов Иван Иванович" class="glass-input">

                    <label style="font-size:12px; color:var(--text-sub); display:block; margin-bottom:4px; font-weight:600;">Месячный оклад (сум)</label>
                    <input type="number" id="newEmpSalary" placeholder="например: 4000000" class="glass-input">

                    <button class="btn-glass btn-primary" onclick="goToStep2()">
                        Далее: Камера
                        <svg class="svg-icon" viewBox="0 0 24 24" style="stroke:#fff;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>

                <!-- ШАГ 2: Контрольный снимок -->
                <div id="add-step-2" class="step-box">
                    <span class="step-badge">Шаг 2 из 2</span>
                    <h3 style="margin-bottom:4px; font-size:16px; font-weight:700;">Фотофиксация сотрудника</h3>
                    <p style="color:var(--text-sub); font-size:13px; margin-bottom:12px;">Сделайте контрольное фото лица для распознавания</p>

                    <div class="camera-card">
                        <video id="webcam-add" autoplay playsinline></video>
                    </div>

                    <div style="display:flex; gap:10px;">
                        <button class="btn-glass btn-outline" style="flex:1;" onclick="goToStep1()">Назад</button>
                        <button class="btn-glass btn-green" style="flex:2;" onclick="saveWorkerWithPhoto()">Сохранить в базу</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- 4. РЕЕСТР / УПРАВЛЕНИЕ СОТРУДНИКАМИ (УДАЛЕНИЕ И АВАНСЫ) -->
        <div id="tab-workers" class="tab-pane" style="display: none;">
            <div style="margin-bottom: 12px; display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size:16px; font-weight:700;">База сотрудников</h3>
                <span id="totalWorkersCount" style="font-size:12px; color:var(--text-sub); font-weight:600;"></span>
            </div>
            <div id="workersContainer"></div>
        </div>

    </div>

    <!-- Модальное окно: Выдача Аванса -->
    <div id="advanceModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:6px; font-size:17px;">Выдача аванса</h3>
            <p id="advanceWorkerName" style="color:var(--text-sub); margin-bottom:14px; font-size:13px;"></p>
            <input type="number" id="advanceAmount" placeholder="Сумма (сум)" class="glass-input">
            <button class="btn-glass btn-primary" style="margin-bottom:8px;" onclick="submitAdvance()">Провести аванс</button>
            <button class="btn-glass btn-outline" onclick="closeModal('advanceModal')">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно: Подтверждение Удаления Сотрудника -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:6px; font-size:17px; color:var(--accent-danger);">Удаление сотрудника</h3>
            <p id="deleteWorkerName" style="color:var(--text-sub); margin-bottom:16px; font-size:13px;"></p>
            <button class="btn-glass btn-danger" style="margin-bottom:8px;" onclick="confirmDeleteWorker()">Удалить навсегда</button>
            <button class="btn-glass btn-outline" onclick="closeModal('deleteModal')">Отмена</button>
        </div>
    </div>

    <!-- Нижняя Стеклянная Навигация -->
    <div class="glass-nav">
        <button class="nav-item active" onclick="switchTab('scan', this)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            <span>Терминал</span>
        </button>
        <button class="nav-item" onclick="switchTab('summary', this)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            <span>Отчет</span>
        </button>
        <button class="nav-item" onclick="switchTab('add', this)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
            <span>Добавить</span>
        </button>
        <button class="nav-item" onclick="switchTab('workers', this)">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span>База</span>
        </button>
    </div>

    <script>
        let currentAdvanceEmpId = null;
        let currentDeleteEmpId = null;
        let activeWorkingDays = 22;

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);

        async function startCamera(videoElementId) {
            const video = document.getElementById(videoElementId);
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    video.srcObject = stream;
                } catch (err) {
                    console.error("Ошибка инициализации веб-камеры: ", err);
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            startCamera('webcam');
            loadWorkers();
        });

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-pane').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).style.display = 'block';
            btn.classList.add('active');

            if (tab === 'scan') startCamera('webcam');
            if (tab === 'summary') loadSummary();
            if (tab === 'add') goToStep1();
            if (tab === 'workers') loadWorkersList();
        }

        function setWorkingDays(days, btn) {
            activeWorkingDays = days;
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadSummary();
        }

        function goToStep1() {
            document.getElementById('add-step-1').classList.add('active');
            document.getElementById('add-step-2').classList.remove('active');
        }

        function goToStep2() {
            const name = document.getElementById('newEmpName').value;
            const salary = document.getElementById('newEmpSalary').value;
            if (!name || !salary) return alert("Введите ФИО и оклад сотрудника!");

            document.getElementById('add-step-1').classList.remove('active');
            document.getElementById('add-step-2').classList.add('active');
            startCamera('webcam-add');
        }

        async function saveWorkerWithPhoto() {
            const name = document.getElementById('newEmpName').value;
            const salary = document.getElementById('newEmpSalary').value;

            await fetch('/api/employees', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, monthly_salary: parseFloat(salary) })
            });

            document.getElementById('newEmpName').value = '';
            document.getElementById('newEmpSalary').value = '';
            loadWorkers();
            alert(`Сотрудник ${name} сохранен.`);
            switchTab('workers', document.querySelectorAll('.nav-item')[3]);
        }

        async function loadWorkers() {
            const res = await fetch('/api/employees');
            const workers = await res.json();
            const select = document.getElementById('workerSelect');
            select.innerHTML = '<option value="">-- Выберите сотрудника --</option>' +
                workers.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
        }

        async function loadWorkersList() {
            const res = await fetch('/api/employees');
            const workers = await res.json();
            document.getElementById('totalWorkersCount').innerText = `Всего: ${workers.length}`;

            document.getElementById('workersContainer').innerHTML = workers.map(w => `
                <div class="glass-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-size:15px; font-weight:700;">${w.name}</span>
                        <div style="display:flex; gap:6px;">
                            <button class="btn-glass btn-outline" style="padding:5px 10px; font-size:12px;" onclick="openAdvanceModal(${w.id}, '${w.name}')">Аванс</button>
                            <button class="btn-glass btn-danger" style="padding:5px 10px; font-size:12px;" onclick="openDeleteModal(${w.id}, '${w.name}')">Удалить</button>
                        </div>
                    </div>
                    <div style="color:var(--text-sub); font-size:13px;">Месячный оклад: <b>${w.monthly_salary.toLocaleString()} сум</b></div>
                </div>
            `).join('');
        }

        async function loadSummary() {
            const res = await fetch('/api/summary');
            const list = await res.json();

            if (list.length === 0) {
                document.getElementById('summaryList').innerHTML = "<div class='glass-card' style='text-align:center; color:var(--text-sub); font-size:13px;'>Записи отметок за сегодня отсутствуют.</div>";
            } else {
                document.getElementById('summaryList').innerHTML = list.map(s => {
                    const empDailyRate = Math.round(s.monthly_salary / activeWorkingDays);
                    const calculatedEarned = s.worked_today ? empDailyRate : 0;

                    return `
                        <div class="glass-card ${s.is_late ? 'late' : ''}">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                                <b style="font-size:15px; font-weight:700;">${s.name}</b>
                                ${s.is_late ? '<span style="color:var(--warning-color); font-size:11px; font-weight:700; background:rgba(217,119,6,0.1); padding:2px 6px; border-radius:4px;">ОПОЗДАНИЕ</span>' : ''}
                            </div>
                            <div style="color:var(--text-sub); font-size:13px; margin-bottom:8px;">
                                Приход: <b>${s.check_in || '--:--'}</b> | Уход: <b>${s.check_out || '--:--'}</b>
                            </div>
                            <div style="font-size:13px; border-top:1px solid var(--glass-border); padding-top:8px; display:flex; justify-content:space-between;">
                                <span>За день (1/${activeWorkingDays} дн): <b>${calculatedEarned.toLocaleString()} сум</b></span>
                                <span>Аванс: <b style="color:var(--warning-color);">${s.advances.toLocaleString()} сум</b></span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        async function processScan() {
            const empId = document.getElementById('workerSelect').value;
            if (!empId) {
                alert("Выберите сотрудника из списка!");
                return;
            }

            const video = document.getElementById('webcam');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

            const res = await fetch('/api/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ employee_id: parseInt(empId), image: canvas.toDataURL('image/jpeg') })
            });

            const data = await res.json();
            alert(data.message.replace(/<[^>]*>?/gm, ''));
            document.getElementById('workerSelect').value = "";
        }

        // Выдача аванса
        function openAdvanceModal(id, name) {
            currentAdvanceEmpId = id;
            document.getElementById('advanceWorkerName').innerText = "Сотрудник: " + name;
            document.getElementById('advanceModal').style.display = 'flex';
        }

        async function submitAdvance() {
            const amount = document.getElementById('advanceAmount').value;
            if (!amount) return alert("Введите сумму аванса!");

            await fetch('/api/advance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ employee_id: currentAdvanceEmpId, amount: parseFloat(amount) })
            });

            closeModal('advanceModal');
            alert("Аванс успешно выдан.");
            document.getElementById('advanceAmount').value = '';
        }

        // Удаление сотрудника
        function openDeleteModal(id, name) {
            currentDeleteEmpId = id;
            document.getElementById('deleteWorkerName').innerText = `Вы действительно хотите удалить ${name}?`;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        async function confirmDeleteWorker() {
            if (!currentDeleteEmpId) return;

            await fetch(`/api/employees/${currentDeleteEmpId}`, {
                method: 'DELETE'
            });

            closeModal('deleteModal');
            loadWorkers();
            loadWorkersList();
            alert("Сотрудник удален из базы.");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>
</body>
</html>
